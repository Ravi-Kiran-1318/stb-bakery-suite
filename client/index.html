<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Primary Meta Tags -->
    <title>Sri Tirupati Bakery</title>
    <meta name="title" content="Sri Tirupati Bakery" />
    <meta name="description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sri Tirupati Bakery" />
    <meta property="og:description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Sri Tirupati Bakery" />
    <meta property="twitter:description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />

  </head>
  <body>
    <div id="root">
      <style>
        #pwa-splash {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #ffffff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
        }
        #pwa-splash img {
          width: 120px;
          height: 120px;
          animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
          0% { transform: scale(0.95); opacity: 0.8; }
          50% { transform: scale(1.05); opacity: 1; }
          100% { transform: scale(0.95); opacity: 0.8; }
        }
      </style>
      <div id="pwa-splash">
        <img src="/icon-512.png" alt="Sri Tirupati Bakery Loading..." />
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
