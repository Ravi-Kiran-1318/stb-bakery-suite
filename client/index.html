<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <meta name="google-site-verification" content="tnRQ5TWOsX_aCHbYPCl2ApgggEnsVKj1gG0Ge7wyBN0" />
    
    <!-- Primary Meta Tags -->
    <title>Sri Tirupathi Bakery</title>
    <meta name="title" content="Sri Tirupathi Bakery" />
    <meta name="description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sri Tirupathi Bakery" />
    <meta property="og:description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Sri Tirupathi Bakery" />
    <meta property="twitter:description" content="Experience the perfect blend of tradition, quality, and flavor in every bite. Order delicious cakes, pastries, and party supplies online." />

  </head>
  <body>
    <div id="root">
      <style>
        #pwa-splash {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #ffffff; /* Match manifest background_color */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 999999;
        }

        @media (min-width: 768px) {
          #pwa-splash {
            display: none !important;
          }
        }
        @media all and (display-mode: standalone) {
          #pwa-splash {
            display: none !important;
          }
        }
        #pwa-splash img {
          width: 192px;
          height: 192px;
          border-radius: 20%;
        }
        #pwa-splash h1 {
          margin-top: 20px;
          font-family: 'Playfair Display', serif;
          font-size: 24px;
          color: #F59E0B;
          text-align: center;
        }
      </style>
      <div id="pwa-splash">
        <img src="/icon-192.png" alt="Sri Tirupathi Bakery Logo" />
        <h1>Sri Tirupathi Bakery</h1>
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
